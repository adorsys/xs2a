---
# yamllint disable rule:line-length
# ------------------------------------------------------------------
# Global settings
# ------------------------------------------------------------------

#image: "adorsys/ci-build:latest"
image: "gitlab-registry.adorsys.de/adorsys/xs2a/gitlab-ci:latest"


# ------------------------------------------------------------------
# stages
# ------------------------------------------------------------------

stages:
  # - "Validate"
  - "Lint"    # Lint files and configuration
  - "Compile" # build jar and provide as artifact
  - "Test"    # run tests and code quality checks
  - "Package" # dockerize jar and push to docker registry
  - "Release" # release
  - "Clone to github"

# ------------------------------------------------------------------
# variables
# ------------------------------------------------------------------

variables:
  DOCKER_IMAGE_NAME_CMS_MANAGEMENT: "xs2a-consent-management"
  DOCKER_IMAGE_NAME_ASPSP_PROFILE: "xs2a-aspsp-profile"
  DOCKER_IMAGE_NAME_CERTIFICATE_GENERATOR: "xs2a-certificate-generator"
  DOCKER_IMAGE_NAME_JMETER_TEST: "xs2a-performance-tests"

  ###########################
  # Build variables         #
  ###########################

  MAVEN_REPO_PATH: ".m2/repository"
  JAVA_TOOL_OPTIONS: "-XX:+UnlockExperimentalVMOptions -XX:MaxRAM=3G -XX:MaxRAMPercentage=33.0"
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/${MAVEN_REPO_PATH}"

  ###########################
  # Github variables         #
  ###########################

  GITHUB_REPOSITORY: "adorsys/xs2a"
  GITHUB_USERNAME: $GITHUB_USERNAME
  GITHUB_EMAIL: $GITHUB_EMAIL
  GITHUB_SSH_SERVER_FINGERPRINT: $GITHUB_SSH_SERVER_FINGERPRINT
  GITHUB_DEPLOY_KEY_BASE64: $GITHUB_DEPLOY_KEY_BASE64  # Base64-encoded key

# ------------------------------------------------------------------
# reusable yaml anchors
# ------------------------------------------------------------------

.docker_dind_service:
  services:
    - name: docker:27.3.1-dind
      alias: docker
      command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_AUTH_CONFIG: $DOCKER_AUTH_CONFIG

.maven_cache: &maven_cache
  cache:
    key: "maven-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${MAVEN_REPO_PATH}"
    policy: pull-push

.build_java: &build_java
  <<: *maven_cache
  script:
    - sdk use java ${JAVA_VERSION}
    - env BUILD_NUMBER=$CI_PIPELINE_IID ./scripts/set_xs2a_connector_version_in_swagger.sh
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp -DskipITs -DskipTests -Dci.build.number=Build\:${CI_PIPELINE_ID} clean install

.java_tests: &java_tests
  <<: *maven_cache
  script:
    - sdk use java $JAVA_VERSION
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp -DskipITs --fail-at-end clean install -q

.push_dockerhub_images_private:
  extends:
    - .docker_dind_service
  script:
    - test -n "$DOCKER_AUTH_CONFIG" || (echo "DOCKER_AUTH_CONFIG is empty" && exit 1)
    - mkdir -p "$HOME/.docker"
    - printf '%s' "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json"
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CMS_MANAGEMENT}:${DOCKER_TAG}" consent-management/cms-standalone-service
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_ASPSP_PROFILE}:${DOCKER_TAG}" aspsp-profile/aspsp-profile-server
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CERTIFICATE_GENERATOR}:${DOCKER_TAG}" certificate-generator
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CMS_MANAGEMENT}:${DOCKER_TAG}"
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_ASPSP_PROFILE}:${DOCKER_TAG}"
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CERTIFICATE_GENERATOR}:${DOCKER_TAG}"

.push_perf_tests_dockerhub_images_private:
  extends:
    - .docker_dind_service
  script:
    - test -n "$DOCKER_AUTH_CONFIG" || (echo "DOCKER_AUTH_CONFIG is empty" && exit 1)
    - mkdir -p "$HOME/.docker"
    - printf '%s' "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json"
    - docker build -t  "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_JMETER_TEST}:${DOCKER_TAG}" --build-arg build-date=$(date -u +"%Y-%m-%dT%H:%M:%SZ") performance-test
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_JMETER_TEST}:${DOCKER_TAG}"

.release_java_private: &release_java_private
  stage: "Release"
  <<: *maven_cache
  script:
    - sdk use java $BUILD_JAVA_VERSION
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp --settings scripts/mvn-release-settings.xml -Pgitlab-maven -DskipTests -U deploy

.sync_changes_github: &sync_changes_github
  image: alpine/git
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Decode Base64 to SSH key
    - echo "$GITHUB_DEPLOY_KEY_BASE64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    # Configure SSH
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519
    - echo "$GITHUB_SSH_SERVER_FINGERPRINT" >> ~/.ssh/known_hosts
  script:
    - git config --global user.name "$GITHUB_USERNAME"
    - git config --global user.email "$GITHUB_EMAIL"
    - git remote add github git@github.com:$GITHUB_REPOSITORY.git || true
    - |
      # Get existing GitHub branches
      git fetch github --prune
      GITHUB_BRANCHES=$(git ls-remote --heads github | awk -F'/' '{print $3}')
      # Process all support/v2support branches
      for branch in $(git branch -r | grep -E "origin/(v2)?support-.*\.x"); do
        branch=${branch#origin/}
        # Check if branch exists on GitHub
        if ! echo "$GITHUB_BRANCHES" | grep -qxF "$branch"; then
          echo "Pushing new branch: $branch to GitHub"
          git checkout -b "$branch" "origin/$branch"
          git push -u github "$branch"
        else
          echo "Branch $branch already exists on GitHub - skipping"
        fi
      done

# ------------------------------------------------------------------
# jobs
# ------------------------------------------------------------------

#-------------------------------------------------------------------
# lint
#-------------------------------------------------------------------

Lint (Docker compose):
  image: maven:3.9-eclipse-temurin-21
  stage: "Lint"
  except:
    - schedules
    - support-22.x
    - master-22.x
  script:
    - apt update && apt install -yq yamllint curl
    - echo "Installing Docker Compose (v2)"
    - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
    - chmod +x /usr/local/bin/docker-compose
    - echo "Verify Docker Compose version"
    - docker-compose --version
    - echo "Run Docker Compose lint"
    - docker-compose -f docker-compose.yml config -q

Lint (Ci file):
  image: debian:stable-slim
  stage: "Lint"
  except:
    - schedules
    - support-22.x
    - master-22.x
  script:
    - apt-get update && apt-get install yamllint python3-pkg-resources -yq
    - echo "Run Gitlab ci file lint"
    - yamllint -d relaxed .gitlab-ci.yml

Lint (YAML, JSON, XML):
  image: debian:stable-slim
  stage: "Lint"
  except:
    - schedules
    - support-22.x
    - master-22.x
  script:
    - apt-get update && apt-get install jsonlint yamllint libxml2-utils make curl -yq && ln -s /usr/bin/jsonlint-php /usr/bin/jsonlint
    - echo "Run Xs2A core lint"
    - find ./ -type f -name "*.json" -exec jsonlint -q {} \; # lint all json
  # commented cause get many small errors for yaml with spaces empty lines and etc
  #   - find ./ -type f \( -name "*.yml" -o -name "*.yaml" \) -exec yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}}}" {} \;
  # commented cause get error Unsupported version '1.1'
  #     - find ./ -type f \( -iname "*.xml" ! -iname pom.xml \) -exec xmllint --noout {} \;

Lint (PMD CPD):
  image: maven:3.9-eclipse-temurin-21
  stage: "Lint"
  <<: *maven_cache
  except:
    - schedules
    - support-22.x
    - master-22.x
  script:
    - apt update && apt install make -yq
    - echo "Test java code for PMD and CPD"
    - echo "DOCKER_HOST=$DOCKER_HOST"
    - mvn -ntp -Dmaven.test.skip=true package pmd:check # commented cause many duplications pmd:cpd-check
  artifacts:
    paths:
      - "qa/pmd/pmd-ruleset.xml"
      - "**/**/*/pmd.html"
      - "**/*/pmd.xml"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}-pmd"
    expire_in: "10 day"

Lint (dockerfiles):
  image: docker
  stage: "Lint"
  extends:
    - .docker_dind_service
  tags:
    - aws
  except:
    - schedules
    - support-22.x
    - master-22.x
  script:
    - echo "Run Xs2a core dockerfile check"
    - docker run --rm -i hadolint/hadolint < ./consent-management/cms-standalone-service/Dockerfile
    - docker run --rm -i hadolint/hadolint < ./aspsp-profile/aspsp-profile-server/Dockerfile
    - docker run --rm -i hadolint/hadolint < ./xs2a-standalone-starter/Dockerfile
    - docker run --rm -i hadolint/hadolint < ./certificate-generator/Dockerfile

Lint (owasp-dep-check):
  stage: "Lint"
  variables:
    JAVA_TOOL_OPTIONS: "-XX:+UnlockExperimentalVMOptions -Xmx2048m"
  script:
    - mvn -B -U -DnvdApiKey=$NVD_API_KEY -DdataDirectory=dependency-check-data org.owasp:dependency-check-maven:aggregate
  timeout: 4h # downloading NVD records for the first time might take a long time
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json
    expire_in: "10 days"
  cache:
    - key: "maven-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${MAVEN_REPO_PATH}"
      policy: pull-push
    - key: dependency-check
      paths:
        - dependency-check-data
      policy: pull-push
      when: always

#-------------------------------------------------------------------
# Compile
#-------------------------------------------------------------------

Build XS2A:
  stage: "Compile"
  except:
    - schedules
  variables:
    JAVA_VERSION: "21.0.2-open"
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
  <<: *build_java
  artifacts:
    paths:
      - "xs2a-standalone-starter/target/xs2a-standalone-starter-exec.jar"
      - "consent-management/cms-standalone-service/target/consent-management*jar"
      - "aspsp-profile/aspsp-profile-server/target/aspsp-profile*jar"
      - "certificate-generator/target/certificate-generator.jar"
      - "**/target/*"
      - "**/**/target/*"
      - ".m2/repository/de/adorsys/psd2/*/*"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}"
    expire_in: "1 day"

#-------------------
# Test
#-------------------

Test (IT):
  stage: "Test"
  <<: *maven_cache
  services:
    - name: docker:27.3.1-dind
      alias: docker
      command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
  tags:
    - aws
  except:
    - schedules
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_API_VERSION: "1.44"
    TESTCONTAINERS_RYUK_DISABLED: "true"
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
  script:
    - docker --host "$DOCKER_HOST" version || true
    - mvn -ntp failsafe:integration-test failsafe:verify
  artifacts:
    paths:
      - "**/target/site/jacoco/jacoco.xml"
    expire_in: "1 day"

Test (Javadoc):
  stage: "Test"
  <<: *maven_cache
  except:
    - schedules
  variables:
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
    JAVA_VERSION: "21.0.2-open"
  script:
    - sdk use java ${JAVA_VERSION}
    - java -XX:+PrintFlagsFinal -version | grep -Ei "maxheapsize|maxram"
    - mvn -ntp -Dmaven.test.skip=true -Pjavadoc verify javadoc:javadoc

Test (Unit Tests):
  stage: "Test"
  except:
    - schedules
  variables:
    JAVA_VERSION: "21.0.2-open"
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
  <<: *java_tests
  artifacts:
    paths:
      - "**/target/site/jacoco/jacoco.xml"
    expire_in: "1 day"

Test (ASCII Doc):
  stage: "Test"
  except:
    - schedules
  image: adorsys/arc42-tools
  variables:
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
  before_script: []
  script:
    - make pages

