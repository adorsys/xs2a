Build and push images to private repo (develop):
  extends: .docker-build-push-base
  stage: "Package"
  rules: !reference [.pipeline-develop-only, rules]
  variables: { DOCKER_TAG: develop }
  script:
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CMS_MANAGEMENT}:${DOCKER_TAG}" consent-management/cms-standalone-service
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_ASPSP_PROFILE}:${DOCKER_TAG}" aspsp-profile/aspsp-profile-server
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CERTIFICATE_GENERATOR}:${DOCKER_TAG}" certificate-generator
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CMS_MANAGEMENT}:${DOCKER_TAG}"
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_ASPSP_PROFILE}:${DOCKER_TAG}"
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CERTIFICATE_GENERATOR}:${DOCKER_TAG}"

Build and push images to private repo (master):
  extends: .docker-build-push-base
  stage: "Package"
  rules: !reference [.pipeline-master-only, rules]
  variables: { DOCKER_TAG: latest }
  script:
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CMS_MANAGEMENT}:${DOCKER_TAG}" consent-management/cms-standalone-service
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_ASPSP_PROFILE}:${DOCKER_TAG}" aspsp-profile/aspsp-profile-server
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CERTIFICATE_GENERATOR}:${DOCKER_TAG}" certificate-generator
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CMS_MANAGEMENT}:${DOCKER_TAG}"
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_ASPSP_PROFILE}:${DOCKER_TAG}"
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CERTIFICATE_GENERATOR}:${DOCKER_TAG}"

Build and push images to private repo (Tags):
  extends: .docker-build-push-base
  stage: "Package"
  rules: !reference [.pipeline-tags-only, rules]
  variables: { DOCKER_TAG: "$CI_COMMIT_TAG" }
  script:
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CMS_MANAGEMENT}:${DOCKER_TAG}" consent-management/cms-standalone-service
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_ASPSP_PROFILE}:${DOCKER_TAG}" aspsp-profile/aspsp-profile-server
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CERTIFICATE_GENERATOR}:${DOCKER_TAG}" certificate-generator
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CMS_MANAGEMENT}:${DOCKER_TAG}"
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_ASPSP_PROFILE}:${DOCKER_TAG}"
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_CERTIFICATE_GENERATOR}:${DOCKER_TAG}"

Build and push image to private repo (perf test):
  extends: .docker-build-push-base
  stage: "Package"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes: [performance-test/**/*]
      when: on_success
    - when: never
  variables: { DOCKER_TAG: develop }
  script:
    - docker build -t "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_JMETER_TEST}:${DOCKER_TAG}" --build-arg build-date=$(date -u +"%Y-%m-%dT%H:%M:%SZ") performance-test
    - docker push "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${DOCKER_IMAGE_NAME_JMETER_TEST}:${DOCKER_TAG}"

Release snapshot artifacts (develop):
  extends: .maven-release-snapshot

Release snapshot artifacts (tags):
  extends: .maven-release-tags

clone_to_github:
  extends: .github-sync
  stage: "Clone to github"
  needs: []
  rules:
    - if: |
        $CI_PIPELINE_SOURCE == "web" &&
        ($CI_COMMIT_REF_NAME =~ /^(v2)?support-.*\.x$/ || $CI_COMMIT_REF_NAME == "develop")
      when: always
    - if: |
        $CI_PIPELINE_SOURCE == "schedule" &&
        $SCHEDULE_TYPE != "security-scan" &&
        ($CI_COMMIT_REF_NAME =~ /^(v2)?support-.*\.x$/ || $CI_COMMIT_REF_NAME == "develop")
      when: always
    - when: never

CycloneDX + OWASP (on push):
  extends: .cyclonedx-owasp
  rules: !reference [.feature-branch-security-only, rules]

Trivy Filesystem Scan (on push):
  extends: .trivy-fs
  before_script: []
  rules: !reference [.feature-branch-security-only, rules]

Trivy Dockerfile Scan (on push):
  extends: .trivy-dockerfile
  before_script: []
  rules: !reference [.feature-branch-security-only, rules]

# ── Unified Remediation (creates MR with all fixes) ───────────────────────────

Unified Remediation:
  extends: .unified-remediation-scheduled

Renovate Update:
  extends: .renovate-update

Notify Slack (Renovate):
  extends: .slack_notify_renovate
  variables:
    RENOVATE_BRANCH_PREFIX: "bugFix/issue-0001-"

Notify Slack (Remediation):
  extends: .slack_notify_remediation
  needs:
    - job: "Unified Remediation"
      optional: true

Notify Slack (security failure):
  extends: .slack-security-failure-notify
  needs:
    - job: "Security (owasp-dep-check - gate)"
      optional: true
    - job: "Security (cyclonedx - gate)"
      optional: true
    - job: "Trivy Filesystem Scan (gate)"
      optional: true
    - job: "Trivy Dockerfile Scan (gate)"
      optional: true
    - job: "SonarQube"
      optional: true
