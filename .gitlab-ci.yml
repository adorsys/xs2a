include:
  - project: 'adorsys/xs2a/gitlab-ci-templates'
    ref: 'v1.4.12'
    file:
      - 'templates/jobs/notify/slack-notify.yml'
      - 'templates/jobs/notify/slack-renovate-notify.yml'
      - 'templates/jobs/lint/ci-file-lint.yml'
      - 'templates/jobs/lint/docker-compose-lint.yml'
      - 'templates/jobs/lint/dockerfile-lint.yml'
      - 'templates/jobs/lint/pmd-cpd.yml'
      - 'templates/jobs/security/owasp-dependency-check.yml'
      - 'templates/jobs/security/trivy.yml'
      - 'templates/jobs/security/cyclonedx-owasp.yml'
      - 'templates/jobs/security/renovate.yml'
      - 'templates/jobs/security/unified-remediation.yml'
      - 'templates/jobs/security/unified-remediation-scheduled.yml'
      - 'templates/jobs/notify/slack-remediation-notify.yml'
      - 'templates/jobs/lint/yaml-json-xml-lint.yml'
      - 'templates/jobs/build/java-maven.yml'
      - 'templates/jobs/test/java-tests.yml'
      - 'templates/jobs/package/sonarqube.yml'
      - 'templates/jobs/package/docker-build-push.yml'
      - 'templates/jobs/release/maven-release.yml'
      - 'templates/jobs/release/github-sync.yml'
      - 'templates/jobs/security/secret-detection.yml'
      - 'templates/jobs/notify/slack-security-failure-notify.yml'

image: "gitlab-registry.adorsys.de/adorsys/xs2a/gitlab-ci:latest"

# Prevent duplicate pipelines: when a branch push has an open MR, suppress
# the branch push pipeline and let the MR pipeline run exclusively.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - "Lint"
  - "Compile"
  - "Test"
  - "Security"
  - "security-scan"
  - "Package"
  - "Release"
  - "Clone to github"
  - "Notify"

variables:
  DOCKER_AUTH_CONFIG: $DOCKER_AUTH_CONFIG
  DOCKER_IMAGE_NAME_CMS_MANAGEMENT: "xs2a-consent-management"
  DOCKER_IMAGE_NAME_ASPSP_PROFILE: "xs2a-aspsp-profile"
  DOCKER_IMAGE_NAME_CERTIFICATE_GENERATOR: "xs2a-certificate-generator"
  DOCKER_IMAGE_NAME_JMETER_TEST: "xs2a-performance-tests"
  DOCKERHUB_REGISTRY: "gitlab-registry.adorsys.de"
  DOCKERHUB_NAMESPACE: "adorsys/xs2a/aspsp-xs2a"
  JAVA_VERSION: "21.0.2-open"
  JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
  MAVEN_REPO_PATH: ".m2/repository"
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/${MAVEN_REPO_PATH}"
  GITHUB_REPOSITORY: "adorsys/xs2a"

# Override GitLab Secret Detection job to use our template instead
secret_detection:
  extends: .secret-detection

Lint (Docker compose):
  extends: .lint-docker-compose
  rules: !reference [.pipeline-feature-branches-only, rules]

Lint (Ci file):
  extends: .lint-ci-file
  rules: !reference [.pipeline-feature-branches-only, rules]

Lint (YAML, JSON, XML):
  extends: .lint-yaml-json-xml
  rules: !reference [.pipeline-feature-branches-only, rules]

Lint (dockerfiles):
  extends: .lint-dockerfiles-base
  stage: "Lint"
  tags: [aws]
  rules: !reference [.pipeline-feature-branches-only, rules]
  script:
    - docker run --rm -i hadolint/hadolint < ./consent-management/cms-standalone-service/Dockerfile
    - docker run --rm -i hadolint/hadolint < ./aspsp-profile/aspsp-profile-server/Dockerfile
    - docker run --rm -i hadolint/hadolint < ./xs2a-standalone-starter/Dockerfile
    - docker run --rm -i hadolint/hadolint < ./certificate-generator/Dockerfile

Lint (PMD CPD):
  extends: .lint-pmd-only-with-settings
  rules: !reference [.pipeline-feature-branches-only, rules]

Security (owasp-dep-check):
  extends: .owasp-dependency-check
  rules: !reference [.feature-branch-security-only, rules]

Security (owasp-dep-check - gate):
  extends: .owasp-dependency-check-strict
  rules: !reference [.pipeline-default-branches-and-security-scan, rules]

Security (cyclonedx - gate):
  extends: .cyclonedx-owasp-strict
  rules: !reference [.pipeline-default-branches-and-security-scan, rules]

Trivy Filesystem Scan (gate):
  extends: .trivy-fs-strict
  before_script: []
  rules: !reference [.pipeline-default-branches-and-security-scan, rules]

Trivy Dockerfile Scan (gate):
  extends: .trivy-dockerfile-strict
  before_script: []
  rules: !reference [.pipeline-default-branches-and-security-scan, rules]

Build XS2A:
  extends: .build-java-maven-base
  stage: "Compile"
  rules: !reference [.pipeline-always-except-schedules, rules]
  script:
    - env BUILD_NUMBER=$CI_PIPELINE_IID ./scripts/set_xs2a_connector_version_in_swagger.sh
    - mvn -ntp -DskipITs -DskipTests --settings scripts/mvn-release-settings.xml -Dci.build.number=Build\:${CI_PIPELINE_ID} clean install
  artifacts:
    paths:
      - "xs2a-standalone-starter/target/xs2a-standalone-starter-exec.jar"
      - "consent-management/cms-standalone-service/target/consent-management*jar"
      - "aspsp-profile/aspsp-profile-server/target/aspsp-profile*jar"
      - "certificate-generator/target/certificate-generator.jar"
      - "**/target/*"
      - ".m2/repository/de/adorsys/psd2/*/*"
    name: "${CI_PROJECT_NAME}-${CI_BUILD_REF_NAME#*v}"
    expire_in: "1 day"

Test (IT):
  extends: .test-java-integration
  tags: [aws]
  rules: !reference [.pipeline-always-except-schedules, rules]
  script:
    - docker --host "$DOCKER_HOST" version || true
    - mvn -ntp --settings scripts/mvn-release-settings.xml failsafe:integration-test failsafe:verify

Test (Javadoc):
  extends: .test-javadoc-with-settings
  rules: !reference [.pipeline-always-except-schedules, rules]

Test (Unit Tests):
  extends: .test-java-unit-settings
  rules: !reference [.pipeline-always-except-schedules, rules]

Test (ASCII Doc):
  stage: "Test"
  image: adorsys/arc42-tools
  rules: !reference [.pipeline-always-except-schedules, rules]
  before_script: []
  script:
    - make pages

