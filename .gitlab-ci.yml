  tags:
    - aws
  services:
    - docker:dind
  only:
    - master
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_TAG: latest
    DOCKERHUB_REGISTRY: gitlab-registry.adorsys.de
    DOCKERHUB_NAMESPACE: "adorsys/xs2a/aspsp-xs2a"
  <<: *push_dockerhub_images_private

Build and push images to private repo (Tags):
  stage: "Package"
  services:
    - docker:dind
  tags:
    - aws
  only:
    - tags
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_TAG: $CI_COMMIT_TAG
    DOCKERHUB_REGISTRY: gitlab-registry.adorsys.de
    DOCKERHUB_NAMESPACE: "adorsys/xs2a/aspsp-xs2a"
  <<: *push_dockerhub_images_private

Build and push image to private repo (perf test):
  stage: "Package"
  services:
    - docker:dind
  tags:
    - aws
  only:
    refs:
      - develop
    changes:
      - performance-test/**/*
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_TAG: develop
    DOCKERHUB_REGISTRY: gitlab-registry.adorsys.de
    DOCKERHUB_NAMESPACE: "adorsys/xs2a/aspsp-xs2a"
  <<: *push_perf_tests_dockerhub_images_private

Release snapshot artifacts (develop):
  stage: "Release"
  only:
    - develop
  except:
    - schedules
  cache: {}
  variables:
    BUILD_JAVA_VERSION: "21.0.2-open"
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
  <<: *release_java_private

Release snapshot artifacts (tags):
  stage: "Release"
  only:
    - tags
  except:
    - schedules
  cache: {}
  variables:
    BUILD_JAVA_VERSION: "21.0.2-open"
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"
  <<: *release_java_private

clone_to_github:
  #  <<: *sync_changes_github
  #  stage: "Clone to github"
  #  rules:
  #    - if: '$CI_COMMIT_REF_NAME == "ci/issue-1984-sync-github"'
  #      when: always
  <<: *sync_changes_github
  stage: "Clone to github"
  rules:
    - if: |
        $CI_PIPELINE_SOURCE == "schedule" &&
        ($MONTH == "06" || $MONTH == "12") &&
        ($CI_COMMIT_REF_NAME =~ /^(v2)?support-.*\.x$/ || $CI_COMMIT_REF_NAME == "develop")
      when: always
