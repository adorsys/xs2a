Upload to SonarQube:
  stage: Package
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  before_script: []
  cache:
    - key: "sonar-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${SONAR_USER_HOME}/cache"
      policy: pull-push
    - key: "maven-cache-$CI_COMMIT_REF_SLUG"
      paths:
        - "${MAVEN_REPO_PATH}"
      policy: pull-push
  dependencies:
    - "Build XS2A"
    - "Test (Unit Tests)"
    - "Test (IT)"
    - "Lint (owasp-dep-check)"
    - "Lint (PMD CPD)"
  script:
    - mvn -Dmaven.repo.local=${CI_PROJECT_DIR}/${MAVEN_REPO_PATH} sonar:sonar -Dsonar.qualitygate.wait=true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'support-22.x'

Build and push images to private repo (develop):
  stage: "Package"
  tags:
    - aws
  except:
    - schedules
  only:
    - support-22.x
  variables:
    DOCKER_TAG: develop
    DOCKERHUB_REGISTRY: gitlab-registry.adorsys.de
    DOCKERHUB_NAMESPACE: "adorsys/xs2a/aspsp-xs2a"
  extends: .push_dockerhub_images_private

Build and push images to private repo (master):
  stage: "Package"
  tags:
    - aws
  only:
    - master-22.x
  variables:
    DOCKER_TAG: latest
    DOCKERHUB_REGISTRY: gitlab-registry.adorsys.de
    DOCKERHUB_NAMESPACE: "adorsys/xs2a/aspsp-xs2a"
  extends: .push_dockerhub_images_private

Build and push images to private repo (Tags):
  stage: "Package"
  tags:
    - aws
  only:
    - tags
  variables:
    DOCKER_TAG: $CI_COMMIT_TAG
    DOCKERHUB_REGISTRY: gitlab-registry.adorsys.de
    DOCKERHUB_NAMESPACE: "adorsys/xs2a/aspsp-xs2a"
  extends: .push_dockerhub_images_private

Build and push image to private repo (perf test):
  stage: "Package"
  tags:
    - aws
  only:
    refs:
      - support-22.x
    changes:
      - performance-test/**/*
  variables:
    DOCKER_TAG: develop
    DOCKERHUB_REGISTRY: gitlab-registry.adorsys.de
    DOCKERHUB_NAMESPACE: "adorsys/xs2a/aspsp-xs2a"
  extends: .push_perf_tests_dockerhub_images_private

Release snapshot artifacts (develop):
  stage: "Release"
  <<: [*maven_cache, *release_java_private]
  only:
    - support-22.x
  except:
    - schedules
  variables:
    BUILD_JAVA_VERSION: "21.0.2-open"
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"

Release snapshot artifacts (tags):
  stage: "Release"
  <<: [*maven_cache, *release_java_private]
  only:
    - tags
  except:
    - schedules
  variables:
    BUILD_JAVA_VERSION: "21.0.2-open"
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStorePassword=changeit -XX:MaxRAM=3G"

clone_to_github:
  #  <<: *sync_changes_github
  #  stage: "Clone to github"
  #  rules:
  #    - if: '$CI_COMMIT_REF_NAME == "ci/issue-1984-sync-github"'
  #      when: always
  <<: *sync_changes_github
  stage: "Clone to github"
  rules:
    - if: |
        $CI_PIPELINE_SOURCE == "schedule" &&
        ($MONTH == "06" || $MONTH == "12") &&
        ($CI_COMMIT_REF_NAME =~ /^(v2)?support-.*\.x$/ || $CI_COMMIT_REF_NAME == "develop")
      when: always
